<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Breign Avatar</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="stage"></div>

    <div id="loading" class="loading">Chargement de l’avatar…</div>

    <header class="topbar">
      <div class="brand"><span class="dot"></span><span id="agent-name">Avatar Breign</span></div>
      <div class="status" id="status">Non connecté</div>
      <button id="settings-btn" class="icon" title="Réglages" aria-label="Réglages">⚙</button>
    </header>

    <section class="chat" aria-live="polite">
      <div id="messages" class="messages"></div>
      <form id="composer" class="composer">
        <button type="button" id="mic" class="icon" title="Parler (maintenir)" aria-label="Parler">🎙</button>
        <input id="input" type="text" autocomplete="off" placeholder="Écrivez à l’avatar…" />
        <button type="submit" id="send">Envoyer</button>
      </form>
    </section>

    <dialog id="settings">
      <form method="dialog" id="settings-form">
        <h2>Réglages</h2>
        <label>URL de l’API
          <input name="basePath" placeholder="/breign-api" />
          <small>En local, <code>/breign-api</code> passe par le proxy vers https://api.breign.eu.</small>
        </label>
        <label>Clé API
          <input name="apiKey" type="password" autocomplete="off" placeholder="x-api-key" />
          <small>Profil Breign → clés API. Stockée uniquement dans ce navigateur.</small>
        </label>
        <label>Agent
          <div class="row"><input name="agentId" placeholder="id de l’agent" /><button type="button" id="load-agents">Lister</button></div>
          <select id="agent-list" hidden></select>
        </label>
        <label>Application (avatar) — optionnel
          <input name="appId" placeholder="id de l’application, pour la voix Breign" />
          <small>Sans application, la voix du navigateur est utilisée.</small>
        </label>
        <label>Langue
          <select name="lang"><option value="fr">Français</option><option value="en">English</option><option value="de">Deutsch</option><option value="es">Español</option><option value="it">Italiano</option></select>
        </label>
        <label>Modèle 3D (GLB)
          <input name="modelUrl" placeholder="/models/mpfb.glb" />
          <small>Tout GLB avec blendshapes ARKit ou visèmes Oculus (Avaturn, CC4, MetaHuman…).</small>
        </label>
        <div class="actions">
          <button type="button" id="demo">Tester la voix</button>
          <button value="cancel" formnovalidate>Annuler</button>
          <button value="save" class="primary">Enregistrer</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
