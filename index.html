<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Breign Avatar</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="stage"></div>

    <div id="loading" class="loading">Chargement de l’avatar…</div>

    <header class="topbar">
      <div class="brand"><span id="agent-name">Avatar Breign</span></div>
      <button id="settings-btn" class="icon" title="Réglages" aria-label="Réglages">⚙</button>
    </header>

    <!-- Sous-titres de la conversation -->
    <section class="captions" aria-live="polite">
      <p id="caption-user" class="caption user"></p>
      <p id="caption-agent" class="caption agent"></p>
    </section>

    <!-- Indicateur d'état : pas de bouton, juste un témoin d'écoute -->
    <div class="presence">
      <div id="orb" class="orb" aria-hidden="true"><span></span></div>
      <div id="hint" class="hint">Touchez l’écran pour commencer</div>
    </div>

    <div id="error" class="error" role="alert"></div>

    <button id="start" class="start" aria-label="Commencer la conversation">
      <span class="start-title" id="start-title">Commencer la conversation</span>
      <span class="start-sub" id="start-sub">Autorisez le micro, puis parlez naturellement. Vous pouvez couper la parole à l’avatar à tout moment.</span>
    </button>

    <form id="type-box" class="type-box">
      <input id="type-input" type="text" autocomplete="off" placeholder="Écrire plutôt que parler… (Entrée)" />
    </form>

    <dialog id="settings">
      <form method="dialog" id="settings-form">
        <h2>Réglages</h2>
        <label>URL de l’API
          <input name="basePath" placeholder="/breign-api" />
          <small>En local, <code>/breign-api</code> passe par le proxy vers https://api.breign.eu.</small>
        </label>
        <div class="account">
          <span class="account-label">Compte Breign</span>
          <div id="account-out" class="row">
            <button type="button" id="login" class="primary">Se connecter avec Breign</button>
          </div>
          <div id="account-in" class="row" hidden>
            <span id="account-name" class="account-name"></span>
            <button type="button" id="logout">Se déconnecter</button>
          </div>
          <details id="api-key-box">
            <summary>Utiliser une clé API à la place</summary>
            <input name="apiKey" type="password" autocomplete="off" placeholder="x-api-key" />
            <small>Profil Breign → clés API. Stockée uniquement dans ce navigateur.</small>
          </details>
        </div>
        <label>Agent
          <div class="row"><input name="agentId" placeholder="id de l’agent" /><button type="button" id="load-agents">Lister</button></div>
          <select id="agent-list" hidden></select>
        </label>
        <label>Application (avatar) — optionnel
          <input name="appId" placeholder="id de l’application, pour la voix Breign" />
          <small>Sans application, la voix du navigateur est utilisée.</small>
        </label>
        <label>Langue
          <select name="lang"><option value="fr">Français</option><option value="en">English</option><option value="de">Deutsch</option><option value="es">Español</option><option value="it">Italiano</option></select>
        </label>
        <label>Apparence du bot
          <select name="appearance">
            <option value="human">Humain réaliste</option>
            <option value="orb">Orbe IA (mascotte)</option>
          </select>
        </label>
        <fieldset class="swatches only-orb">
          <legend>Couleur de l’orbe</legend>
          <label class="swatch" style="--c: #2f8cff"><input type="radio" name="orbColor" value="blue" /><span></span>Bleu</label>
          <label class="swatch" style="--c: #ff9a1f"><input type="radio" name="orbColor" value="orange" /><span></span>Orange</label>
          <label class="swatch" style="--c: #1fe08a"><input type="radio" name="orbColor" value="green" /><span></span>Vert</label>
          <label class="swatch" style="--c: #9b5cff"><input type="radio" name="orbColor" value="violet" /><span></span>Violet</label>
        </fieldset>
        <label class="only-human">Modèle 3D (GLB)
          <input name="modelUrl" placeholder="/models/human.glb" />
          <small>Tout GLB avec blendshapes ARKit ou visèmes Oculus (Avaturn, CC4, MetaHuman…).</small>
        </label>
        <div class="actions">
          <button type="button" id="demo">Tester la voix</button>
          <button value="cancel" formnovalidate>Annuler</button>
          <button value="save" class="primary">Enregistrer</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
